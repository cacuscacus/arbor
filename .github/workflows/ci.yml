name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Shell script syntax
        run: |
          bash -n scripts/dev-check.sh
          bash -n scripts/package-macos.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: CLI smoke
        run: |
          cargo run -q -p arbor-cli -- version
          cargo run -q -p arbor-cli -- list .

      - name: Homebrew cask shape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("Casks/arbor.rb").read_text()
          assert re.search(r'cask "arbor"', text), "missing cask name"
          assert re.search(r'version "', text), "missing version"
          assert re.search(r'sha256 "', text), "missing sha256"
          assert "REPLACE_WITH" not in text, "placeholder checksum still present"
          print("cask ok")
          PY

  swift:
    name: Swift pure-logic tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SPM tests (Markdown renderer, languages, Go to Folder, search pattern)
        run: swift test

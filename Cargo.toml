[workspace]
resolver = "2"
members = [
    "crates/arbor-core",
    "crates/arbor-ffi",
    "crates/arbor-cli",
]

[workspace.package]
version = "1.4.5"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cacuscacus/arbor"
authors = ["Arbor Contributors"]
rust-version = "1.75"

[workspace.dependencies]
arbor-core = { path = "crates/arbor-core" }
arbor-ffi = { path = "crates/arbor-ffi" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
ignore = "0.4"
notify = "7"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
